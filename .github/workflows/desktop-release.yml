name: desktop-release

on:
  push:
    tags: ['desktop-v*']

concurrency:
  group: desktop-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPDATE_URL: ${{ vars.UPDATE_URL }}
  API_ORIGIN: ${{ vars.API_ORIGIN }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-latest
            builder_args: --mac
          - os: windows-latest
            builder_args: --win
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Variabili di deploy presenti
        shell: bash
        run: |
          for name in UPDATE_URL API_ORIGIN; do
            if [[ -z "${!name:-}" ]]; then
              echo "ERRORE: variabile di repository $name non impostata"
              exit 1
            fi
          done

      - name: Il tag deve coincidere con la versione dell'app
        shell: bash
        run: |
          expected="desktop-v$(node -p "require('./desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME diverso da $expected"
            exit 1
          fi

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high --omit=dev
          npm run build

      - name: Desktop - dipendenze e test
        working-directory: desktop
        run: |
          npm ci
          npm audit --audit-level=high
          npm test

      - name: Chiave API App Store Connect su file
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          key_file="$RUNNER_TEMP/apple_api_key.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_file"
          echo "APPLE_API_KEY=$key_file" >> "$GITHUB_ENV"

      # Import manuale nel portachiavi del runner: il portachiavi temporaneo che electron-builder
      # crea da CSC_LINK non si sblocca sui runner macOS recenti (SecKeychainUnlock).
      - name: Certificato Developer ID nel portachiavi
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          for secret_name in CSC_LINK CSC_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "ERRORE: variabile $secret_name mancante o vuota per la firma Mac"
              exit 1
            fi
          done
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          cert_file="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$CSC_LINK" | base64 --decode > "$cert_file"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$cert_file" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$cert_file"
          if ! security find-identity -v -p codesigning "$keychain" | grep -q "Developer ID Application"; then
            echo "ERRORE: nessuna identità Developer ID Application con chiave privata nel certificato importato"
            exit 1
          fi

      - name: Packaging Mac (firma e notarizzazione)
        if: runner.os == 'macOS'
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'true'
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          for secret_name in APPLE_API_KEY_ID APPLE_API_ISSUER; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "ERRORE: variabile $secret_name mancante o vuota per firma e notarizzazione Mac"
              exit 1
            fi
          done
          if [[ ! -s "${APPLE_API_KEY:-}" ]]; then
            echo "ERRORE: file APPLE_API_KEY mancante o vuoto per la notarizzazione Mac"
            exit 1
          fi
          npx electron-builder ${{ matrix.builder_args }} --publish never -c.extraMetadata.apiOrigin="$API_ORIGIN"

      - name: Packaging Windows (non firmato)
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: npx electron-builder ${{ matrix.builder_args }} --publish never -c.extraMetadata.apiOrigin="$API_ORIGIN"

      - name: Verifica pacchetto
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)
              app="desktop/release/mac-universal/Project Tracker.app"
              app_update="desktop/release/mac-universal/Project Tracker.app/Contents/Resources/app-update.yml"
              web_index="desktop/release/mac-universal/Project Tracker.app/Contents/Resources/web/index.html"
              app_asar="desktop/release/mac-universal/Project Tracker.app/Contents/Resources/app.asar"
              if ! codesign --verify --deep --strict --verbose=2 "$app"; then
                echo "ERRORE: verifica della firma Mac fallita"
                exit 1
              fi
              if ! spctl --assess --type execute --verbose "$app"; then
                echo "ERRORE: valutazione Gatekeeper del pacchetto Mac fallita"
                exit 1
              fi
              if ! xcrun stapler validate "$app"; then
                echo "ERRORE: verifica del ticket di notarizzazione Mac fallita"
                exit 1
              fi
              ;;
            Windows)
              app_update="desktop/release/win-unpacked/resources/app-update.yml"
              web_index="desktop/release/win-unpacked/resources/web/index.html"
              app_asar="desktop/release/win-unpacked/resources/app.asar"
              ;;
            *)
              echo "ERRORE: sistema operativo non previsto per la verifica del pacchetto: $RUNNER_OS"
              exit 1
              ;;
          esac

          if [[ ! -f "$app_update" ]]; then
            echo "ERRORE: file app-update.yml mancante nel pacchetto: $app_update"
            exit 1
          fi

          if ! grep -Fqx "url: $UPDATE_URL" "$app_update"; then
            echo "ERRORE: $app_update non contiene la riga attesa: url: $UPDATE_URL"
            exit 1
          fi

          # extraMetadata non espande ${env.*}: senza questo controllo l'app parte con un origin letterale invalido.
          root="$PWD"
          tmp="$(mktemp -d)"
          (cd "$tmp" && "$root/desktop/node_modules/.bin/asar" extract-file "$root/$app_asar" package.json)
          packaged_origin="$(sed -n 's/.*"apiOrigin": *"\([^"]*\)".*/\1/p' "$tmp/package.json")"
          if [[ "$packaged_origin" != "$API_ORIGIN" ]]; then
            echo "ERRORE: apiOrigin nel pacchetto ($packaged_origin) diverso da API_ORIGIN ($API_ORIGIN)"
            exit 1
          fi

          if [[ ! -f "$web_index" ]]; then
            echo "ERRORE: web/index.html mancante nel pacchetto: $web_index"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          if-no-files-found: error
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest*.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: eu-central-1

      # Ordine voluto: binari, poi link stabili, poi i latest*.yml che i client leggono per primi.
      - name: Pubblica su S3
        working-directory: release
        env:
          BUCKET: ${{ vars.UPDATES_BUCKET }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          require_single_file() {
            local pattern="$1"
            shift
            if (( $# != 1 )); then
              echo "ERRORE: atteso esattamente un file per $pattern, trovati $#"
              exit 1
            fi
            if [[ ! -f "$1" ]]; then
              echo "ERRORE: file richiesto mancante o non regolare: $1"
              exit 1
            fi
          }
          require_single_file 'latest.yml' latest.yml
          require_single_file 'latest-mac.yml' latest-mac.yml
          require_single_file 'Project-Tracker-*-mac.zip' Project-Tracker-*-mac.zip
          require_single_file 'Project-Tracker-*-mac.dmg' Project-Tracker-*-mac.dmg
          require_single_file 'Project-Tracker-Setup-*.exe' Project-Tracker-Setup-*.exe
          tag_version="${GITHUB_REF_NAME#desktop-v}"
          for feed in latest.yml latest-mac.yml; do
            feed_version="$(sed -n 's/^version: //p' "$feed")"
            if [[ "$feed_version" != "$tag_version" ]]; then
              echo "ERRORE: la versione in $feed non coincide con il tag $GITHUB_REF_NAME"
              exit 1
            fi
          done
          for file in *.dmg *.zip *.exe *.blockmap; do
            aws s3 cp "$file" "s3://$BUCKET/updates/$file"
          done
          dmg=(Project-Tracker-*-mac.dmg)
          exe=(Project-Tracker-Setup-*.exe)
          aws s3 cp "${dmg[0]}" "s3://$BUCKET/updates/Project-Tracker.dmg" --cache-control no-cache
          aws s3 cp "${exe[0]}" "s3://$BUCKET/updates/Project-Tracker-Setup.exe" --cache-control no-cache
          for file in latest*.yml; do
            aws s3 cp "$file" "s3://$BUCKET/updates/$file" --cache-control no-cache
          done
